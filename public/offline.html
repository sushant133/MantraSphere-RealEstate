<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>You are offline · MantraSphere Real Estate</title>
    <link rel="icon" href="/icons/favicon-32.png" />
    <style>
      :root { color-scheme: light dark; --bg: #ffffff; --fg: #141a33; --muted: #5b6275; --primary: #1f2a5c; --accent: #f2a93b; }
      @media (prefers-color-scheme: dark) { :root { --bg: #141a33; --fg: #f4f5f9; --muted: #b5bacb; --primary: #c9d1f5; } }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--fg);
        font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Devanagari", sans-serif; }
      main { max-width: 440px; text-align: center; }
      img { width: 64px; height: 64px; }
      h1 { margin: 16px 0 4px; font-size: 1.5rem; color: var(--primary); }
      p { margin: 4px 0; color: var(--muted); }
      .ne { margin-top: 20px; }
      button { margin-top: 24px; min-height: 48px; padding: 0 24px; border: 0; border-radius: 12px; background: var(--accent); color: #1b1300;
        font: inherit; font-weight: 600; cursor: pointer; }
      button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="" width="64" height="64" />
      <h1>You are offline</h1>
      <p>Check your mobile data or Wi-Fi. Pages you opened recently may still work.</p>
      <div class="ne" lang="ne">
        <h1>तपाईं अफलाइन हुनुहुन्छ</h1>
        <p>मोबाइल डाटा वा वाइफाइ जाँच गर्नुहोस्।</p>
      </div>
      <button type="button" onclick="location.reload()">Try again · फेरि प्रयास गर्नुहोस्</button>
    </main>
  </body>
</html>
